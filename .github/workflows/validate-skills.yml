name: validate-skills

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [18, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Validate SKILL.md frontmatter
        run: bash ./scripts/validate-skills

      - name: Syntax-check install.sh
        run: bash -n ./install.sh

      - name: Syntax-check run.sh
        run: bash -n ./run.sh

      - name: Syntax-check scripts/committer
        run: bash -n ./scripts/committer

      - name: Syntax-check scripts/validate-skills
        run: bash -n ./scripts/validate-skills

      - name: Syntax-check scripts/sync-skills
        run: bash -n ./scripts/sync-skills

      - name: Runtime and installer regression tests (no model calls)
        run: npm test

      - name: Runtime syntax and isolated installed-skill sync check
        run: npm run check
